{% extends 'base.html' %}
{% load static %}

{% block head %}
<link rel="stylesheet" href="{% static 'css/productdetail.css' %}">
{% endblock %}

{% block content %}
<main>
  <div class="container">
    <div class="row">
      <div class="col-md-6 col-sm-12">
        <div class="carusel2">
          <div id="carouselExampleDark" class="carousel slide">
            <div class="carousel-inner">
              <div class="carousel-item active" data-bs-interval="10000">
                <img src="{{ product.image.url }}" class="d-block w-100" alt="...">
              </div>
              <div class="carousel-item" data-bs-interval="2000">
                <img src="{{ product.image2.url }}" class="d-block w-100" alt="...">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark"
              data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Предыдущий</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark"
              data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
              <span class="visually-hidden">Следующий</span>
            </button>
          </div>
        </div>
      </div>
    
      <div class="col-md-6 col-sm-12">
        <div class="card1">
          <div class="card-body">
            <h5 class="card-title1">{{ product.name }}</h5>
            <p class="card-text1"><b>{{ product.description|linebreaksbr }}</b></p>

            <form action="{% url 'basket_add' product.id %}" method="post">
              {% csrf_token %}
              <input type="hidden" name="product_id" value="{{ product.id }}">
              <div class="viborrazmera">
                <label class="razmer" for="size">Розмір:</label>
                <select name="size" id="size">
                  {% for size in product.sizes %}
                  <option value="{{ size }}">{{ size }}</option>
                  {% endfor %}
                </select>
                <button type="button" class="size-guide-btn" data-bs-toggle="modal" data-bs-target="#sizeGuideModal">
                  Розмірна сітка
              </button>
              <div class="modal fade" id="sizeGuideModal" tabindex="-1" aria-labelledby="sizeGuideModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-lg">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title" id="sizeGuideModalLabel">Розмірна сітка</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <div class="modal-body">
                            <img src="#" class="img-fluid" alt="розмірна сітка">
                        </div>
                    </div>
                </div>
            </div>

              </div>
              <div class="viborrazmera2">
                <b>
                  <p class="card-text1">{{ product.price }} &#8372;</p>
                </b>
                <div id="liveAlertPlaceholder"></div>
                <button type="submit" class="btn2" id="liveAlertBtn">Додати в кошик</button>
              </div>
            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</main>
<script src="{% static 'js/proddetail/alert.js' %}"></script>     
<script src="{% static 'js/proddetail/AJAX.js' %}"></script>
<script src="{% static 'js/proddetail/lypa.js' %}"></script>
{% endblock %}
