{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="{% static 'fav/favicon.ico' %}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{%  static 'css/style.css'  %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{% static 'css/cart-counter.css' %}">
    <link rel="stylesheet" href="{% static 'css/base-cart-counter.css' %}">
    {% block head %}
    
    {% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark" style="background-color: #000000 !important;">
    <div class="container-fluid">
      <a href="{% url 'catalog_view' %}"><img src="https://i.ibb.co/DgSWkmY1/photo-2024-12-22-23-23-09.jpg"  border="0" width="50" height="50"></a>
      <div class="nav-items">
        <ul class="navbar-nav">
          <li class="nav-item d-flex align-items-center">
            <a class="nav-link me-3" aria-current="page" href="{% url 'catalog_view' %}"><img src="https://i.ibb.co/GvRndV2s/website-home-page.png"" border="0" width="30" height="30"></a>
            <a class="nav-link position-relative" href="{% url 'basket_view' %}">
              <img src="https://i.ibb.co/DfZXVH5x/shopping-cart-1.png" border="0" width="30" height="30">
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger cart-counter" {% if basket_count == 0 %}style="display: none;"{% endif %}>
                {{ basket_count|default:"0" }}
                <span class="visually-hidden">товарів у кошику</span>
              </span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

{% block content %}

  {% endblock %}

 <footer>
  <p style="display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 10px;">
    <a class="nav-link" href="{% url 'contact_view' %}" style="padding: 0; margin: 0; color: rgb(184, 178, 178);">Контакти</a>
    <a class="nav-link" href="{% url 'delivret' %}" style="padding: 0; margin: 0; color: rgb(184, 178, 178);">Доставка/оплата</a>
</p>
<p style="display: flex; align-items: center; justify-content: center; gap: 10px;">
    &copy; 2025 Voidstreet_studio 
    <a href="https://www.instagram.com/voidstreet_studio/?utm_source=qr&igsh=bTU0dHNta2hhaHdv#" target="_blank">
        <i class="bi bi-instagram" style="color: #ffffff"></i>
    </a>
</p>
  </footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="{% static 'js/basketjs/cart-counter.js' %}"></script>
</body>
</html>
